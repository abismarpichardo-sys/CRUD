{% extends "layout.html" %}
{% block content %}
<h1><i class="fas fa-envelope"></i> Enviar Correo a Clientes</h1>

<div class="form-container-single">
    <form method="post" action="{{ url_for('enviar_correo') }}">

        <div class="form-group">
            <label for="correo">Correo del Cliente</label>
            <input type="email" id="correo" name="correo" placeholder="cliente@correo.com" required>
        </div>

        <div class="form-group">
            <label for="asunto">Asunto</label>
            <input type="text" id="asunto" name="asunto" placeholder="Asunto del mensaje" required>
        </div>

        <div class="form-group">
            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe el mensaje..." required></textarea>
        </div>

        <button type="submit" class="btn-primary"><i class="fas fa-paper-plane"></i> Enviar</button>
    </form>
</div>
{% endblock %}
