<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CRUD Clientes</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        /* Pestañas */
        .tab { display: none; }
        .tab-active { display: block; }
        .tab-buttons { text-align: center; margin-top: 20px; }
        .tab-buttons button {
            padding: 10px 20px;
            margin: 0 5px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #240582;
            color: white;
            font-weight: 600;
            transition: 0.3s;
        }
        .tab-buttons button:hover { background-color: #52b3dc; }

        .form-buttons { width: 100%; text-align: center; margin-top: 15px; }

        /* Botón Mostrar Todos */
        .btn-mostrar-todos {
            display: inline-block;
            margin-left: 10px;
            padding: 8px 14px;
            background-color: #240582;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-mostrar-todos:hover { background-color: #52b3dc; }

        /* Popup tipo MessageBox */
        #popup-message {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 1000;
            font-weight: 600;
            display: none; /* inicialmente oculto */
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Gestión de Clientes</h1>

    <!-- Popup para mensajes -->
    <div id="popup-message">
        <p id="popup-text"></p>
    </div>

    <!-- Pestaña Agregar Cliente -->
    <div id="agregar" class="tab {% if tab_activa == 'agregar' %}tab-active{% endif %}">
        <form action="/agregar" method="POST">
            <input type="text" name="nombre" placeholder="Nombre" required>
            <input type="text" name="apellido" placeholder="Apellido" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="text" name="teléfono" placeholder="Teléfono">
            <input type="text" name="dirección" placeholder="Dirección">
            <div class="form-buttons">
                <input type="submit" value="Agregar">
            </div>
        </form>
        <div class="tab-buttons">
            <button onclick="showTab('buscar')">Buscar Clientes</button>
        </div>
    </div>

    <!-- Pestaña Buscar Clientes -->
    <div id="buscar" class="tab {% if tab_activa == 'buscar' %}tab-active{% endif %}">
        <form method="GET" action="/buscar">
            <input type="text" name="filtro" placeholder="Buscar por nombre, apellido o ID" value="{{ filtro|default('') }}">
            <input type="submit" value="Buscar">
            <a href="/buscar" class="btn-mostrar-todos">Mostrar Todos</a>
        </form>

        <table>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Email</th>
                <th>Teléfono</th>
                <th>Dirección</th>
                <th>Acciones</th>
            </tr>
            {% for cliente in clientes %}
            <tr>
                <td>{{ cliente.id }}</td>
                <td>{{ cliente.nombre }}</td>
                <td>{{ cliente.apellido }}</td>
                <td>{{ cliente.email }}</td>
                <td>{{ cliente.teléfono }}</td>
                <td>{{ cliente.dirección }}</td>
                <td class="acciones">
                    <a href="/editar/{{ cliente.id }}" class="btn-editar">✏️ Editar</a>
                    <a href="/eliminar/{{ cliente.id }}" class="btn-eliminar" onclick="return confirm('¿Seguro que deseas eliminar este cliente?')">🗑️ Eliminar</a>
                </td>
            </tr>
            {% endfor %}
        </table>

        <div class="tab-buttons">
            <button onclick="showTab('agregar')">Atrás</button>
        </div>
    </div>
</div>

<script>
    // Función para cambiar entre pestañas
    function showTab(tabId){
        document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('tab-active'));
        document.getElementById(tabId).classList.add('tab-active');
    }

    // Mostrar popup de mensaje si hay flash
    const flashMessage = "{{ get_flashed_messages()[0] if get_flashed_messages() else '' }}";
    if(flashMessage){
        const popup = document.getElementById('popup-message');
        const text = document.getElementById('popup-text');
        text.textContent = flashMessage;
        popup.style.display = 'block';
        setTimeout(() => { popup.style.display = 'none'; }, 3000);
    }
</script>
</body>
</html>
