<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Clientes{% endblock %}</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<div class="main-layout">
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-users"></i> 
            Admin Clientes
        </div>
        <nav class="sidebar-nav">
            <a href="/" class="nav-item {% if active_page == 'listar' %}active{% endif %}">
                <i class="fas fa-list-ul"></i> 
                Ver Clientes
            </a>
            <a href="/registro" class="nav-item {% if active_page == 'agregar' %}active{% endif %}">
                <i class="fas fa-plus-circle"></i> 
                Agregar Cliente
            </a>
            <a href="{{ url_for('enviar_correo') }}" class="nav-item">
                <i class="fas fa-envelope"></i> Enviar Correo
            </a>

        </nav>
    </div>

    <div class="content-area">
        <div id="popup-message">
            <p id="popup-text"></p>
        </div>

        {% block content %}{% endblock %}
    </div>
</div>

<script>
    // Script para manejar el popup de mensajes flash
    const flashMessage = "{{ get_flashed_messages()[0] if get_flashed_messages() else '' }}";
    if(flashMessage){
        const popup = document.getElementById('popup-message');
        const text = document.getElementById('popup-text');
        text.textContent = flashMessage;
        popup.style.display = 'block';
        // Ocultar después de 3 segundos
        setTimeout(() => { popup.style.display = 'none'; }, 3000);
    }
</script>
</body>
</html>
