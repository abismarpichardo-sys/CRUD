<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Cliente</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .registro-card {
      background: #fff;
      padding: 40px 45px;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      width: 380px;
      text-align: center;
    }

    h2 {
      color: #2c3e50;
      margin-bottom: 0.5rem;
    }

    .registro-subtitulo {
      color: #7f8c8d;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    form {
      text-align: left;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      font-weight: bold;
      color: #34495e;
      display: block;
      margin-bottom: 0.3rem;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #dce4ec;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: #3498db;
      outline: none;
    }

    button {
      background: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      width: 100%;
      margin-top: 0.5rem;
    }

    button:hover {
      background: #2980b9;
    }

    p {
      margin-top: 1.2rem;
      color: #7f8c8d;
    }

    a {
      color: #3498db;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }

    .mensaje {
      color: red;
      margin-bottom: 10px;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="registro-card">
    <h2>Crear Cuenta</h2>
    <p class="registro-subtitulo">Regístrate para acceder a tu perfil de cliente</p>

    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% if mensajes %}
        {% for categoria, mensaje in mensajes %}
          <div class="mensaje">{{ mensaje }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label for="nombre"><i class="fas fa-user"></i> Nombre</label>
        <input type="text" id="nombre" name="nombre" required placeholder="Ingresa tu nombre completo">
      </div>

      <div class="form-group">
        <label for="email"><i class="fas fa-envelope"></i> Correo electrónico</label>
        <input type="email" id="email" name="email" required placeholder="Ejemplo: nombre@correo.com">
      </div>

      <div class="form-group">
        <label for="password"><i class="fas fa-lock"></i> Contraseña</label>
        <input type="password" id="password" name="password" required placeholder="Crea una contraseña segura">
      </div>

      <button type="submit"><i class="fas fa-user-plus"></i> Registrarse</button>
    </form>

    <p>¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión aquí</a></p>
  </div>
</body>
</html>
